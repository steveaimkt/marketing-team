<circle cx="344" cy="362" r="8" fill="#747264"/>
<text x="1024" y="328" text-anchor="end" font-size="16" fill="#A9A49C">2026.08</text>
<text x="176" y="410" font-size="20" fill="#2A2A28">다른 거 쓰면 다음 날 올라오는데 이건 안 올라와서 두 통째입니다.</text>
<rect x="140" y="470" width="920" height="180" rx="16" fill="#FFFFFF" stroke="#E6E1DA" stroke-width="2"/>
<rect x="176" y="504" width="44" height="44" rx="22" fill="#DFDAD2"/>
<rect x="236" y="516" width="118" height="20" rx="10" fill="#DFDAD2"/>
<circle cx="240" cy="562" r="8" fill="#747264"/>
<circle cx="266" cy="562" r="8" fill="#747264"/>
<circle cx="292" cy="562" r="8" fill="#747264"/>
<circle cx="318" cy="562" r="8" fill="#747264"/>
<circle cx="344" cy="562" r="8" fill="#DFDAD2"/>
<text x="1024" y="528" text-anchor="end" font-size="16" fill="#A9A49C">2026.08</text>
<text x="176" y="610" font-size="20" fill="#2A2A28">여름에도 안 미끈거려서 좋아요. 아침에 바르고 나가도 번들거림이 없습니다.</text>
<rect x="140" y="670" width="920" height="180" rx="16" fill="#FFFFFF" stroke="#E6E1DA" stroke-width="2"/>
<rect x="176" y="704" width="44" height="44" rx="22" fill="#DFDAD2"/>
<rect x="236" y="716" width="118" height="20" rx="10" fill="#DFDAD2"/>
<circle cx="240" cy="762" r="8" fill="#747264"/>
<circle cx="266" cy="762" r="8" fill="#747264"/>
<circle cx="292" cy="762" r="8" fill="#747264"/>
<circle cx="318" cy="762" r="8" fill="#747264"/>
<circle cx="344" cy="762" r="8" fill="#747264"/>
<text x="1024" y="728" text-anchor="end" font-size="16" fill="#A9A49C">2026.07</text>
<text x="176" y="810" font-size="20" fill="#2A2A28">성분표를 맨 위에 적어 둬서 고르기 편했습니다. 함량까지 있는 건 처음 봤어요.</text>
<rect x="140" y="870" width="920" height="180" rx="16" fill="#FFFFFF" stroke="#E6E1DA" stroke-width="2"/>
<rect x="176" y="904" width="44" height="44" rx="22" fill="#DFDAD2"/>
