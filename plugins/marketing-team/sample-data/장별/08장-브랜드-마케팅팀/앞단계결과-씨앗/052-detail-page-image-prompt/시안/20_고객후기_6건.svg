<circle cx="266" cy="1362" r="8" fill="#747264"/>
<circle cx="292" cy="1362" r="8" fill="#747264"/>
<circle cx="318" cy="1362" r="8" fill="#DFDAD2"/>
<circle cx="344" cy="1362" r="8" fill="#DFDAD2"/>
<text x="1024" y="1328" text-anchor="end" font-size="16" fill="#A9A49C">2026.06</text>
<text x="176" y="1410" font-size="20" fill="#2A2A28">펌프가 조금 헐거운 느낌입니다. 내용물은 만족합니다.</text>
<text x="600" y="1552" text-anchor="middle" font-size="16" fill="#9A9894">후기는 개인의 사용 경험이며 효과는 사람마다 다를 수 있습니다</text>
