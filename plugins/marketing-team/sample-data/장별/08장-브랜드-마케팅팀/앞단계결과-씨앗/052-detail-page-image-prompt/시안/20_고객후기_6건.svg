<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3EEE8"/></linearGradient></defs>
<rect width="1200" height="1600" fill="url(#g)"/>
<text x="600" y="112" text-anchor="middle" font-size="26" fill="#747264">실제로 쓰신 분들의 말</text>
<text x="600" y="176" text-anchor="middle" font-size="48" font-weight="700" fill="#2A2A28">후기 6건을 그대로 옮깁니다</text>
<text x="600" y="220" text-anchor="middle" font-size="16" fill="#9A9894">* 아이디와 프로필 사진은 가렸습니다 · 효능을 단정한 후기는 싣지 않았습니다</text>
<rect x="140" y="270" width="920" height="180" rx="16" fill="#FFFFFF" stroke="#E6E1DA" stroke-width="2"/>
<rect x="176" y="304" width="44" height="44" rx="22" fill="#DFDAD2"/>
<rect x="236" y="316" width="118" height="20" rx="10" fill="#DFDAD2"/>
<circle cx="240" cy="362" r="8" fill="#747264"/>
