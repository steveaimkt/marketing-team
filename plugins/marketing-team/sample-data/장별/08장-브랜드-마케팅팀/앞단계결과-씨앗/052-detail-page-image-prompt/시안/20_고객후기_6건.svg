<circle cx="266" cy="1162" r="8" fill="#747264"/>
<circle cx="292" cy="1162" r="8" fill="#747264"/>
<circle cx="318" cy="1162" r="8" fill="#747264"/>
<circle cx="344" cy="1162" r="8" fill="#747264"/>
<text x="1024" y="1128" text-anchor="end" font-size="16" fill="#A9A49C">2026.07</text>
<text x="176" y="1210" font-size="20" fill="#2A2A28">향이 아예 없어서 좋습니다. 향 때문에 못 쓰는 제품이 많았어요.</text>
<rect x="140" y="1270" width="920" height="180" rx="16" fill="#FFFFFF" stroke="#E6E1DA" stroke-width="2"/>
<rect x="176" y="1304" width="44" height="44" rx="22" fill="#DFDAD2"/>
