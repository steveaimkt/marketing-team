<circle cx="292" cy="962" r="8" fill="#747264"/>
<circle cx="318" cy="962" r="8" fill="#747264"/>
<circle cx="344" cy="962" r="8" fill="#DFDAD2"/>
<text x="1024" y="928" text-anchor="end" font-size="16" fill="#A9A49C">2026.07</text>
<text x="176" y="1010" font-size="20" fill="#2A2A28">두 통쯤 쓰니 확실히 달라진 느낌입니다. 처음엔 잘 모르겠더라고요.</text>
<rect x="140" y="1070" width="920" height="180" rx="16" fill="#FFFFFF" stroke="#E6E1DA" stroke-width="2"/>
<rect x="176" y="1104" width="44" height="44" rx="22" fill="#DFDAD2"/>
