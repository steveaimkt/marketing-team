# 정본이 깨진 채로 배포되지 않게 한다.
#
# 왜: 검사 스크립트는 있었지만 사람이 기억해서 쳐야 했다. 안 치면 깨진 채로 push 되고,
#     코워크 사용자는 「설치했는데 안 뜬다」로 만난다. 여기서 자동으로 친다.
#
# 층 · A는 무료라 항상 돈다. B(실제 모델 라우팅)는 돈이 들어 손으로 눌러야 돈다.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── A층 · 무료 · 매번 ────────────────────────────────────────
  static:
    name: 정본 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 설치해도 그대로 뜨는가
        run: node plugins/marketing-team/scripts/verify.mjs

      - name: 스킬 100개가 계약대로 생겼는가
        run: node plugins/marketing-team/scripts/validate-skills.mjs

      - name: 부를 말이 아직 그 스킬로 가는가
        run: node plugins/marketing-team/scripts/eval-routing.mjs

      - name: 문서의 숫자가 정본과 맞는가
        run: node plugins/marketing-team/scripts/build-stats.mjs --check

      - name: 생성물이 최신인가 (ROUTING·카탈로그)
        run: |
          node plugins/marketing-team/scripts/build-routing.mjs
          node plugins/marketing-team/scripts/build-catalog.mjs
          if ! git diff --exit-code --stat; then
            echo "::error::생성물이 정본과 어긋난다. 아래를 돌리고 커밋해라 —"
            echo "  node plugins/marketing-team/scripts/build-routing.mjs"
            echo "  node plugins/marketing-team/scripts/build-catalog.mjs"
            exit 1
          fi

  # ── 릴리스 관문 · 손으로 누를 때만 ───────────────────────────
  #    사람이 밟는 「실제 확인」이 미완이면 여기서 막는다.
  #    ⚠️ A층(정본 검사)에 두면 안 된다 — 그건 **푸시마다** 돌아서
  #       사람이 밟기 전까지 main 이 영구히 빨개진다 (실측 2026-08-27).
  #       버전 게이트는 버전을 올리면 스스로 풀리지만 이 게이트는 사람만 풀 수 있다.
  release:
    name: 릴리스 관문 (수동)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 실제 확인을 밟았는가
        env:
          RELEASE: '1'
        run: node plugins/marketing-team/scripts/verify.mjs

  # ── B층 · 유료 · 손으로 누를 때만 ────────────────────────────
  #    Actions 탭 → verify → Run workflow.  ANTHROPIC_API_KEY 시크릿이 있어야 돈다.
  live:
    name: 실제 모델 라우팅 (수동)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 키가 없으면 건너뛴다
        id: key
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$K" ]; then
            echo "::notice::ANTHROPIC_API_KEY 시크릿이 없어 B층을 건너뛴다"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.key.outputs.go == 'yes'
        run: npm i --no-save @anthropic-ai/sdk

      - if: steps.key.outputs.go == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node plugins/marketing-team/scripts/eval-routing.mjs --live --report
